name: CI

# 테스트 + 빌드 게이트. 배포는 하지 않는다.
#
# 배포는 Vercel Git 통합이 담당한다(프로젝트 my-mini-notion이 main에 연결, push 시 자동).
# 이전 `deploy.yml`은 GitHub Pages로 정적 export를 올리던 잔재였는데,
# `next.config.ts`에서 static export가 제거된 뒤 `cp out/index.html` 스텝에서 상시
# 실패했다(2026-07-23 이후 main push 5회 연속 실패). 빌드 스텝 자체는 통과했으므로
# 그 검증 가치만 이 워크플로가 승계하고, 죽은 배포 경로는 삭제했다.
#
# 상시 빨간불은 "CI 실패"를 배경 소음으로 만들어 진짜 회귀 신호를 가린다 —
# 이 워크플로는 초록이 기본값이어야 한다.

on:
  # 모든 브랜치 push를 대상으로 한다. 이 저장소는 feature 브랜치(00N-*)에서 작업하고
  # main으로 fast-forward 머지하므로, main에만 걸면 이미 머지된 뒤에야 신호가 온다.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# 게이트는 최신 커밋만 의미가 있다. 같은 ref에 새 push가 오면 진행 중 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 로컬 개발 환경(v24.18.0)과 동일한 LTS. 이전 워크플로는 node-version: 20이라
          # 러너가 24로 강제 실행하며 deprecation 경고를 냈다.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (vitest)
        run: npm test

      - name: Build (next build — TypeScript 검사 포함)
        # 테스트만으로는 부족하다: config·타입·export 오류는 빌드에서만 드러난다.
        run: npm run build
        env:
          # 공개 키(빌드 시 클라이언트 번들로 인라인). repo → Settings →
          # Secrets and variables → Actions → Variables 에 등록.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Verify harness excluded from production bundle
        # 하니스가 프로덕션 번들에 새지 않는지. 플래그 없이 빌드해 라우트·마커 부재를 본다.
        # 로컬에서만 도는 검증은 결국 아무도 안 돌리므로 CI에 건다.
        run: npm run verify:harness
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (playwright)
        # jsdom이 못 잡는 렌더 회귀 5건. webServer가 NEXT_PUBLIC_E2E=1로 dev 서버를 띄운다.
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
